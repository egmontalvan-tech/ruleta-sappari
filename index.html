<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPPARI - Ruleta de la Fortuna</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { color: #E50914; margin-bottom: 5px; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #ccc; margin-bottom: 25px; font-size: 14px; text-align: center; max-width: 300px; }
        .wheel-container { position: relative; width: 330px; height: 330px; margin-bottom: 30px; }
        canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 25px rgba(229, 9, 20, 0.4); border: 8px solid #222; }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #E50914;
            z-index: 10;
        }
        .spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            background-color: #E50914;
            border: 4px solid #222;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }
        .result-box {
            font-size: 16px;
            font-weight: bold;
            color: #4CD964;
            text-align: center;
            min-height: 50px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            width: 100%;
            max-width: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
