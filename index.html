<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPPARI - Ruleta de la Fortuna</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)), url('https://images.unsplash.com/photo-1611143669185-af224c5e3252?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        h1 { 
            color: #E50914; 
            margin-bottom: 5px; 
            font-size: 28px; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
        }
        p { color: #aaa; margin-bottom: 30px; font-size: 14px; text-align: center; max-width: 300px; }
        
        .wheel-container { 
            position: relative; 
            width: 340px; 
            height: 340px; 
            margin-bottom: 35px;
        }
        
        /* Efecto futurista y marco exterior de la ruleta */
        canvas { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.5), inset 0 0 20px rgba(0,0,0,0.8); 
            border: 6px solid #1f1f1f; 
            background: #000;
        }
        
        /* Indicador superior sobrio */
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 26px solid #E50914;
            z-index: 10;
            filter: drop-shadow(0 2px 5px rgba(229, 9, 20, 0.5));
        }
        
        /* Botón central interactivo con el logo de SAPPARI */
        .spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background-color: #fff;
            background-image: url('https://i.ibb.co/68Z4wZp/logo-removebg-preview.png');
            background-size: 85% 85%;
            background-repeat: no-repeat;
            background-position: center;
            border: 4px solid #E50914;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.7), inset 0 0 8px rgba(0,0,0,0.3);
            z-index: 12;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .spin-btn:active {
            transform: translate(-50%, -50%) scale(0.92);
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.9);
        }

        .result-box {
            font-size: 15px;
            font-weight: 600;
            color: #4CD9
